<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Plant Guardian Quiz</title>
<style>
:root{--g:#166534;--g2:#22c55e;--bg:#f0fdf4;--card:#fff;--text:#143322;--muted:#5f7465;--danger:#b91c1c;--warn:#b45309;--r:20px}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.wrap{max-width:760px;margin:auto;padding:12px 12px 38px}.hero{padding:20px;border-radius:24px;background:linear-gradient(135deg,#14532d,#16a34a);color:#fff;margin-bottom:12px}
.hero h1{margin:0;font-size:clamp(1.45rem,6vw,2.2rem)}.hero p{margin:5px 0 0;opacity:.94}.card{background:var(--card);border:1px solid #bbf7d0;border-radius:var(--r);padding:16px;margin:12px 0}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.btn,input,select{width:100%;min-height:52px;border-radius:15px;padding:12px 14px}.btn{border:0;background:var(--g);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:var(--g);border:1px solid #22c55e}.btn.danger{background:var(--danger)}.btn:disabled{opacity:.45}
input,select{border:1px solid #86efac;background:#fff;color:var(--text)}label{font-weight:700;display:block;margin-bottom:12px}label span{display:block;margin-bottom:6px}.hidden{display:none!important}
.status{padding:12px 14px;border-radius:15px;background:#f0fdf4;border:1px dashed #4ade80}.status.warn{background:#fffbeb;border-color:#fbbf24;color:#92400e}.status.error{background:#fef2f2;border-color:#f87171;color:#991b1b}
.center{text-align:center}.roomcode{font-size:2rem;letter-spacing:.14em;font-weight:900}.qrbox{display:inline-block;background:#fff;border:8px solid #fff;border-radius:18px;margin:12px 0}.small{font-size:.9rem;color:var(--muted)}
.quizTop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;top:6px;z-index:4}.metric{background:#fff;border:1px solid #bbf7d0;border-radius:15px;text-align:center;padding:8px}.metric b{display:block;font-size:1.25rem}
.plantImage{width:100%;aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(135deg,#dcfce7,#f0fdf4);border-radius:18px;overflow:hidden;margin-bottom:14px;font-size:4rem}.plantImage img{width:100%;height:100%;object-fit:cover}
.qtitle{font-size:clamp(1.25rem,5vw,1.75rem);font-weight:900;text-align:center;margin:8px 0 14px}.answers{display:grid;gap:10px}.answer{min-height:68px;border:2px solid #bbf7d0;background:#fff;color:var(--text);border-radius:16px;padding:14px;text-align:left;font-weight:750}.answer:active{transform:scale(.99)}.answer.correct{border-color:#16a34a;background:#dcfce7}.answer.wrong{border-color:#ef4444;background:#fee2e2}.progress{height:10px;border-radius:99px;background:#dcfce7;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#16a34a;width:0;transition:.2s}
.rank{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:11px 3px;border-bottom:1px solid #dcfce7}.rankno{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#dcfce7;font-weight:900}
.dataBadge{display:inline-block;padding:4px 9px;border-radius:999px;background:#fffbeb;color:#92400e;font-size:.78rem;margin-top:8px}
@media(max-width:560px){.g2{grid-template-columns:1fr}.wrap{padding:8px}.card{padding:13px}.hero{padding:17px}.answer{min-height:74px;font-size:1rem}.plantImage{aspect-ratio:4/3}.quizTop{top:4px}.roomcode{font-size:1.7rem}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><h1>🌿 Plant Guardian Quiz</h1><p>Kahoot + Quizizz สำหรับพรรณไม้ของโรงเรียน</p></header>
<section id="home" class="card"><h2>เลือกบทบาท</h2><div class="grid g2"><button id="hostBtn" class="btn">🎛️ ผู้จัดกิจกรรม</button><button id="joinBtn" class="btn secondary">📱 ผู้เข้าแข่งขัน</button></div><p class="small">เกมจับคู่เดิมยังคงอยู่ที่หน้า index.html</p></section>

<section id="host" class="card hidden">
<div id="hostSetup">
<h2>ตั้งค่าห้องคำถาม</h2>
<label><span>โหมดการแข่งขัน</span><select id="mode"><option value="individual">รายบุคคล</option><option value="team">รายทีม</option><option value="battle">Battle Royale</option><option value="time">Time Attack</option></select></label>
<div class="grid g2">
<label><span>จำนวนคำถาม</span><select id="questionCount"><option>10</option><option selected>15</option><option>20</option><option>30</option><option>50</option></select></label>
<label><span>เวลาต่อข้อ</span><select id="seconds"><option value="10">10 วินาที</option><option value="15" selected>15 วินาที</option><option value="20">20 วินาที</option><option value="30">30 วินาที</option></select></label>
</div>
<button id="createRoom" class="btn">สร้างห้องและ QR Code</button>
</div>
<div id="hostLobby" class="hidden">
<div class="center"><div class="status">รหัสห้อง<br><span id="roomCode" class="roomcode"></span></div><div class="qrbox"><canvas id="qrCanvas"></canvas></div></div>
<div class="grid g2"><button id="copyLink" class="btn secondary">คัดลอกลิงก์</button><button id="startRoom" class="btn">เริ่มเกม</button></div>
<h3>คะแนนสด</h3><div id="hostBoard"><p class="small">ยังไม่มีผู้เล่น</p></div>
</div>
</section>

<section id="join" class="card hidden">
<h2>เข้าร่วมเกม</h2>
<label><span>ชื่อผู้เล่น</span><input id="playerName" maxlength="30" placeholder="ชื่อเล่น"></label>
<label id="teamLabel" class="hidden"><span>ชื่อทีม</span><input id="teamName" maxlength="30" placeholder="เช่น ทีมใบไม้"></label>
<label><span>รหัสห้อง</span><input id="joinCode" maxlength="6" inputmode="numeric" placeholder="รหัส 6 หลัก"></label>
<button id="enterRoom" class="btn">เข้าห้อง</button><div id="joinMsg" class="status hidden" style="margin-top:12px"></div>
</section>

<section id="lobby" class="card hidden"><h2>พร้อมแล้ว 🌱</h2><div class="status">ห้อง <b id="lobbyCode"></b> • <b id="lobbyName"></b></div><p>รอผู้จัดกิจกรรมเริ่มเกม</p></section>

<section id="game" class="hidden">
<div class="quizTop"><div class="metric">คะแนน<b id="score">0</b></div><div class="metric">ข้อ<b id="qno">0/0</b></div><div class="metric">เวลา<b id="timer">0</b></div></div>
<div class="card">
<div class="progress"><div id="progressBar"></div></div>
<div id="plantImage" class="plantImage">🌿</div>
<div id="question" class="qtitle"></div>
<div id="answers" class="answers"></div>
<div id="feedback" class="status hidden" style="margin-top:12px"></div>
</div>
</section>

<section id="result" class="card hidden"><h2>🏆 ผลการแข่งขัน</h2><div id="resultText" class="status"></div><h3>อันดับล่าสุด</h3><div id="resultBoard"></div><button id="backHome" class="btn secondary">กลับหน้าแรก</button></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { plantsV2 as plants, plantDatabaseMeta } from './plants-v2.js';
const $=id=>document.getElementById(id),views=['home','host','join','lobby','game','result'];
const show=id=>{views.forEach(v=>$(v).classList.add('hidden'));$(id).classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};
const safe=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let db,fb,online=false;
try{const appMod=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');const dbMod=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js');const app=appMod.initializeApp(firebaseConfig);db=dbMod.getDatabase(app);fb=dbMod;online=true}catch(e){console.error(e)}
plants=plants.filter(p=>p.id&&p.thai&&(p.use||p.feature));
let room='',playerId='',name='',team='',roomData=null,questions=[],index=0,score=0,timeLeft=0,tick=null,answered=false,eliminated=false,unsubs=[];
const roomUrl=c=>`${location.origin}${location.pathname}?room=${c}`;
const makeCode=()=>String(Math.floor(100000+Math.random()*900000));
function shuffle(a,seed){let x=seed||1;const r=()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296};const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function getUse(p){return p.use||p.feature}
function rankRows(obj){return Object.values(obj||{}).sort((a,b)=>(b.score||0)-(a.score||0)).map((p,i)=>`<div class="rank"><span class="rankno">${['🥇','🥈','🥉'][i]||i+1}</span><span><b>${safe(p.name)}</b>${p.team?`<br><span class="small">${safe(p.team)}</span>`:''}</span><b>${p.score||0}</b></div>`).join('')}
$('hostBtn').onclick=()=>show('host');$('joinBtn').onclick=()=>show('join');$('backHome').onclick=()=>location.href=location.pathname;
$('createRoom').onclick=async()=>{if(!online)return alert('เชื่อม Firebase ไม่สำเร็จ');room=makeCode();const seed=Math.floor(Math.random()*1e9);roomData={type:'quiz',mode:$('mode').value,questionCount:+$('questionCount').value,seconds:+$('seconds').value,seed,status:'lobby',createdAt:Date.now()};await fb.set(fb.ref(db,`quizRooms/${room}`),roomData);$('roomCode').textContent=room;$('hostSetup').classList.add('hidden');$('hostLobby').classList.remove('hidden');QRCode.toCanvas($('qrCanvas'),roomUrl(room),{width:230,margin:1});unsubs.push(fb.onValue(fb.ref(db,`quizRooms/${room}/players`),s=>$('hostBoard').innerHTML=rankRows(s.val()||{})||'<p class="small">ยังไม่มีผู้เล่น</p>'))};
$('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(roomUrl(room))}catch{prompt('คัดลอกลิงก์',roomUrl(room))}};
$('startRoom').onclick=async()=>{await fb.update(fb.ref(db,`quizRooms/${room}`),{status:'playing',startedAt:Date.now()});$('startRoom').disabled=true};
async function enterRoom(){name=$('playerName').value.trim();room=$('joinCode').value.replace(/\D/g,'').slice(0,6);if(!name||room.length!==6)return msg('กรุณากรอกชื่อและรหัสห้อง 6 หลัก','error');const s=await fb.get(fb.ref(db,`quizRooms/${room}`));if(!s.exists())return msg('ไม่พบห้องนี้','error');roomData=s.val();team=$('teamName').value.trim();if(roomData.mode==='team'&&!team){$('teamLabel').classList.remove('hidden');return msg('โหมดทีม กรุณากรอกชื่อทีม','warn')}playerId=crypto.randomUUID?.()||Date.now()+'';await fb.set(fb.ref(db,`quizRooms/${room}/players/${playerId}`),{name,team,score:0,status:'ready',joinedAt:Date.now()});$('lobbyCode').textContent=room;$('lobbyName').textContent=name;show('lobby');unsubs.push(fb.onValue(fb.ref(db,`quizRooms/${room}`),snap=>{const d=snap.val();if(d?.status==='playing'&&!questions.length)startGame(d)}))}
function msg(t,c){$('joinMsg').textContent=t;$('joinMsg').className=`status ${c||''}`}
$('enterRoom').onclick=enterRoom;
function buildQuestions(d){const selected=shuffle(plants,d.seed).slice(0,Math.min(d.questionCount,plants.length));return selected.map((p,i)=>{const wrong=shuffle(plants.filter(x=>x.id!==p.id),d.seed+i+99).slice(0,3).map(getUse);return{p,answers:shuffle([getUse(p),...wrong],d.seed+i+333)}})}
function startGame(d){roomData=d;questions=buildQuestions(d);index=0;score=0;eliminated=false;show('game');renderQuestion()}
function renderQuestion(){if(index>=questions.length||eliminated)return finish();answered=false;const q=questions[index];$('qno').textContent=`${index+1}/${questions.length}`;$('progressBar').style.width=`${index/questions.length*100}%`;$('question').textContent=`${q.p.thai} มีลักษณะหรือการใช้ประโยชน์ข้อใด?`;$('feedback').classList.add('hidden');const box=$('plantImage');box.innerHTML=q.p.image?`<img src="${safe(q.p.image)}" alt="${safe(q.p.thai)}">`:'🌿';$('answers').innerHTML='';q.answers.forEach((a,n)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<b>${['▲','◆','●','■'][n]}</b> ${safe(a)}`;b.onclick=()=>answer(b,a);$('answers').append(b)});timeLeft=roomData.seconds;$('timer').textContent=timeLeft;clearInterval(tick);tick=setInterval(()=>{timeLeft--;$('timer').textContent=timeLeft;if(timeLeft<=0){clearInterval(tick);answer(null,'')}},1000)}
async function answer(btn,value){if(answered)return;answered=true;clearInterval(tick);const q=questions[index],correct=value===getUse(q.p);document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent.includes(getUse(q.p)))b.classList.add('correct')});if(!correct&&btn)btn.classList.add('wrong');if(correct){let gain=100;if(roomData.mode==='time')gain+=timeLeft*20;else gain+=timeLeft*5;score+=gain;$('feedback').textContent=`✅ ถูกต้อง +${gain} คะแนน`}else{if(roomData.mode==='battle'){eliminated=true;$('feedback').textContent='💥 ตอบผิด ถูกคัดออกจาก Battle Royale'}else $('feedback').textContent='❌ ยังไม่ถูกต้อง'}$('feedback').classList.remove('hidden');$('score').textContent=score;await fb.update(fb.ref(db,`quizRooms/${room}/players/${playerId}`),{score,status:eliminated?'eliminated':'playing',answered:index+1});setTimeout(()=>{index++;renderQuestion()},1200)}
async function finish(){clearInterval(tick);await fb.update(fb.ref(db,`quizRooms/${room}/players/${playerId}`),{score,status:'finished',finishedAt:Date.now()});show('result');$('resultText').innerHTML=`<b>${safe(name)}</b> ได้ <b>${score}</b> คะแนน`;unsubs.push(fb.onValue(fb.ref(db,`quizRooms/${room}/players`),s=>$('resultBoard').innerHTML=rankRows(s.val()||{})))}
const params=new URLSearchParams(location.search);if(params.get('room')){$('joinCode').value=params.get('room').replace(/\D/g,'').slice(0,6);show('join')}
</script>
</body>
</html>
